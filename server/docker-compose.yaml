version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: course-postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin@123
      POSTGRES_DB: mydb
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: course-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  course-finder:
    build: .
    container_name: course-finder-container
    restart: always
    depends_on:
      - postgres
    environment:
      DATABASE_URL: "postgresql://admin:admin@123@course-postgres:5432/mydb?schema=public"
      REDIS_HOST: "course-redis"
      REDIS_PORT: "6379"
    ports:
      - "3000:3000"
    command: sh -c "npx prisma migrate deploy &&  npx prisma db seed && npm start"

  prometheus:
    image: prom/prometheus:latest
    container_name: course-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
    - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    - prometheus_data:/prometheus
    command:
    - '--config.file=/etc/prometheus/prometheus.yml'
    - '--storage.tsdb.path=/prometheus'
    - '--storage.tsdb.retention.time=15d'
    - '--web.enable-lifecycle'
    depends_on:
      - course-finder

  grafana:
    image: grafana/grafana:latest
    container_name: course-grafana
    restart: always
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_DEFAULT_THEME=dark
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data: